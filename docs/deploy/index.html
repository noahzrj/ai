<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101119">
  <title>Games</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101119;
      color: #eff0ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main { width: min(100%, 680px); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0 0 28px; color: #a4a8bd; line-height: 1.6; }

    ul {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid #34374d;
      border-radius: 12px;
      background: #191b28;
      color: #d3ff69;
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    a:hover { border-color: #d3ff69; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #d3ff69; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <p>Choose a game to play.</p>
    <nav aria-label="Games">
      <ul>
        <li><a href="sandbox.html">Little World Lab</a></li>
        <li><a href="stick_survive.html">Stick &amp; Survive</a></li>
        <li><a href="arcade.html">Hidden Arcade</a></li>
        <li><a href="potato.html">Potato Patch</a></li>
        <li><a href="stickman_fight.html">Stickman Fight</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
